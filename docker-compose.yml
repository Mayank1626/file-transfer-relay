version: '3.8'

services:
  minio:
    image: minio/minio
    container_name: filedrop-minio
    ports:
      - "9000:9000"  # API port
      - "9001:9001"  # Console port
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: supersecret
    command: server /data --console-address ":9001"
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: filedrop-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  flask_api:
    build: .
    container_name: filedrop-flask
    ports:
      - "5000:5000"
    environment:
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=supersecret
      - S3_BUCKET=filedrop
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
    depends_on:
      - minio
      - redis
    restart: unless-stopped

volumes:
  minio_data:
